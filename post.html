<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记 — A6TVhmj</title>
<script>(function(){var t=localStorage.getItem('bp-theme')||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/hljs-blueprint.css">
</head>
<body class="reading">

<header class="topbar" id="topbar"></header>

<main class="wrap">

  <section>
    <h1 id="title" style="font-size:clamp(28px,4.4vw,40px);max-width:680px;margin-bottom:14px">载入中…</h1>
    <div class="row-m" id="meta" style="margin-bottom:8px"></div>
    <p class="measure" id="summary" style="color:var(--dim);margin-top:0"></p>

    <div class="toc" id="toc" hidden>
      <div class="toc-h">Contents / 目录</div>
      <ol id="toc-list"></ol>
    </div>

    <article class="prose" id="content"></article>

    <p style="margin-top:56px">
      <a class="line mono" style="font-size:12px;letter-spacing:.14em" href="posts.html">← ALL NOTES</a>
    </p>
  </section>

</main>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="assets/app.js"></script>
<script>
renderChrome('posts.html');

var slug = new URLSearchParams(location.search).get('p') || '';

/* ---- 把洛谷式 ::::success[标题] ... :::: 折叠块转成 <details> ---- */
function transformFolds(md) {
  var lines = md.split('\n'), out = [], stack = 0;
  for (var i = 0; i < lines.length; i++) {
    var open = lines[i].match(/^:{3,}(success|info|warning|note)\[(.*?)\]\s*$/);
    if (open) {
      out.push('<details class="fold"><summary>' + escapeHtml(open[2]) + '</summary>');
      out.push('<div class="fold-body">');
      out.push('');
      stack++;
      continue;
    }
    if (/^:{3,}\s*$/.test(lines[i]) && stack > 0) {
      out.push('');
      out.push('</div></details>');
      stack--;
      continue;
    }
    out.push(lines[i]);
  }
  while (stack-- > 0) out.push('</div></details>');
  return out.join('\n');
}

/* ---- 给代码块套上 mono 文件名栏 ---- */
function wrapCodeBlocks(root) {
  Array.prototype.forEach.call(root.querySelectorAll('pre > code'), function (code) {
    var pre = code.parentNode;
    var lang = (code.className.match(/language-([\w+#-]+)/) || [, 'text'])[1];
    if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }

    var box = document.createElement('div');
    box.className = 'codeblock';
    var bar = document.createElement('div');
    bar.className = 'codebar';
    bar.innerHTML = '<span>' + lang.toUpperCase() + '</span>';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'COPY';
    btn.onclick = function () {
      navigator.clipboard.writeText(code.textContent).then(function () {
        btn.textContent = 'COPIED';
        setTimeout(function () { btn.textContent = 'COPY'; }, 1200);
      });
    };
    bar.appendChild(btn);

    pre.parentNode.insertBefore(box, pre);
    box.appendChild(bar);
    box.appendChild(pre);
  });
}

/* ---- 目录 ---- */
function buildToc(root) {
  var hs = root.querySelectorAll('h2');
  if (hs.length < 3) return;
  var ol = document.getElementById('toc-list');
  Array.prototype.forEach.call(hs, function (h, i) {
    h.id = 'sec-' + i;
    var li = document.createElement('li');
    li.innerHTML = '<a href="#sec-' + i + '">' + h.textContent + '</a>';
    ol.appendChild(li);
  });
  document.getElementById('toc').hidden = false;
}

loadPosts().then(function (list) {
  var p = list.filter(function (x) { return x.slug === slug; })[0];
  if (!p) {
    document.getElementById('title').textContent = '找不到这篇笔记';
    document.getElementById('content').innerHTML =
      '<p>请回到 <a href="posts.html">笔记列表</a> 重新选择。</p>';
    return;
  }

  document.title = p.title + ' — A6TVhmj';
  document.getElementById('title').textContent = p.title;
  document.getElementById('summary').textContent = p.summary || '';
  document.getElementById('meta').innerHTML =
    '<span>' + p.date + '</span><span>' + (p.category || '') + '</span>' +
    (p.status === 'draft' ? '<span class="tag draft">Draft</span>'
                          : '<span class="tag done">Published</span>') +
    ((p.tags || []).length ? '<span>' + p.tags.map(function (t) { return '#' + t; }).join('  ') + '</span>' : '') +
    (p.origin ? '<a class="line" href="' + p.origin + '" target="_blank" rel="noopener">原文</a>' : '');


  return fetch('posts/' + p.slug + '.md', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('404');
      return r.text();
    })
    .then(function (md) {
      marked.setOptions({ gfm: true, breaks: false });
      var html = marked.parse(transformFolds(md));
      var el = document.getElementById('content');
      el.innerHTML = html;
      wrapCodeBlocks(el);
      buildToc(el);

      function typeset() {
        if (!window.renderMathInElement) return setTimeout(typeset, 60);
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '$',  right: '$',  display: false },
            { left: '\\(', right: '\\)', display: false }
          ],
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false
        });
      }
      typeset();

      if (location.hash) {
        var t = document.querySelector(location.hash);
        if (t) t.scrollIntoView();
      }
    })
    .catch(function () {
      document.getElementById('content').innerHTML =
        '<p>正文文件 <code>posts/' + escapeHtml(slug) + '.md</code> 还没写。</p>';
    });
});
</script>
</body>
</html>
